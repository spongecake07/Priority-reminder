name: Minna mobile proof of concept

on:
  push:
    branches: [mobile-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run mobile:prepare
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build unsigned test APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: minna-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios-project:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run mobile:prepare
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Validate generated iOS project
        run: test -d ios/App/App.xcodeproj && test -d ios/App/App
      - uses: actions/upload-artifact@v4
        with:
          name: minna-ios-project
          path: ios/
