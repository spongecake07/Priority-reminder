name: Minna regression tests
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check minna-chat-add.js
      - name: Run checklist regression suite
        run: node --test tests/*.test.cjs
