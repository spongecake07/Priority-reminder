name: CSS architecture guard
on:
  # The service worker is updated last when a Minna release is complete.
  # Avoid testing transient mismatches during separate CSS/HTML commits.
  push:
    paths:
      - 'service-worker.js'
  pull_request:
    paths:
      - 'styles.css'
      - 'nav-polish.css'
      - 'minna-theme.css'
      - 'index.html'
      - 'service-worker.js'
      - 'scripts/check-css-architecture.mjs'
jobs:
  css-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-css-architecture.mjs
