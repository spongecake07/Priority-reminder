name: Build Minna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'scripts/prepare-android.mjs'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Use the Android SDK already installed on GitHub's Ubuntu runner.
      # setup-android's sdkmanager bootstrap failed on this runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android project
        run: |
          npm run android:prepare
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Minna-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
