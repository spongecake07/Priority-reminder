name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'nav-polish.css'
      - 'minna-theme.css'
      - 'service-worker.js'
      - 'manifest.json'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-android.mjs'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare bundled Minna files
        run: npm run android:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Sync native notification plugin
        run: npx cap sync android
      - name: Declare Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application', 1)
          p.write_text(s)
          PY
      - name: Configure Android status bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/app/minna/reminders/MainActivity.java')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''package app.minna.reminders;

import android.os.Bundle;
import android.view.View;
import android.view.Window;
import android.graphics.Color;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
  @Override
  public void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    Window window = getWindow();
    // Let Android reserve its system-bar space before rendering the WebView.
    androidx.core.view.WindowCompat.setDecorFitsSystemWindows(window, true);
    window.setStatusBarColor(Color.rgb(230, 230, 230));
    window.getDecorView().setSystemUiVisibility(
        window.getDecorView().getSystemUiVisibility() | View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
  }
}
''')
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minna-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
