<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#5b67f1"/><meta name="description" content="An installable priority reminder app with notes, photos, checklists, categories, backup and notifications."/><link rel="manifest" href="manifest.json"/><link rel="icon" href="icons/icon-192.png"/><link rel="apple-touch-icon" href="icons/icon-192.png"/><link rel="stylesheet" href="styles.css"/><title>Priority Reminders</title></head><body>
<header class="topbar"><div><p class="eyebrow">MY REMINDERS</p><h1>Priority Reminders</h1></div><button id="notifyBtn" class="icon-btn" type="button" title="Enable notifications">🔔</button></header>
<main class="app-shell">
<section class="smart-views" aria-label="Smart reminder views"><button class="smart-view active" data-view="all"><span>📋</span><strong>All</strong><small id="smartAllCount">0</small></button><button class="smart-view" data-view="today"><span>☀️</span><strong>Today</strong><small id="todayCount">0</small></button><button class="smart-view" data-view="upcoming"><span>📅</span><strong>Upcoming</strong><small id="upcomingCount">0</small></button><button class="smart-view danger" data-view="overdue"><span>⚠️</span><strong>Overdue</strong><small id="overdueCount">0</small></button></section>
<section class="summary-grid"><button class="summary-card active" data-filter="all"><strong id="countAll">0</strong><span>All priorities</span></button><button class="summary-card high" data-filter="high"><strong id="countHigh">0</strong><span>High</span></button><button class="summary-card medium" data-filter="medium"><strong id="countMedium">0</strong><span>Medium</span></button><button class="summary-card low" data-filter="low"><strong id="countLow">0</strong><span>Low</span></button></section>
<section class="toolbar"><label class="search-wrap"><span>🔎</span><input id="searchInput" type="search" placeholder="Search reminders"/></label><select id="categoryFilter"><option value="all">All categories</option></select><select id="sortSelect"><option value="priority">Priority</option><option value="due">Due date</option><option value="newest">Newest</option></select></section>
<section class="backup-panel"><div><strong>Safe backup</strong><small>Saves every reminder, checklist and attached photo as one file on your phone.</small></div><div class="backup-actions"><button id="exportBackupBtn" type="button">📱 Save to phone</button><label class="restore-btn">↑ Restore<input id="importBackupInput" type="file" accept="application/json,.json" hidden/></label></div></section>
<section id="emptyState" class="empty-state"><div class="empty-icon">✓</div><h2>No reminders here</h2><p>Tap the + button to add a reminder or change your filters.</p></section><section id="reminderList" class="reminder-list"></section></main><button id="addBtn" class="fab" type="button">+</button>
<dialog id="editorDialog" class="editor-dialog"><form id="reminderForm" method="dialog"><div class="dialog-head"><button id="cancelBtn" class="text-btn" type="button">Cancel</button><h2 id="dialogTitle">New Reminder</h2><button class="text-btn save" type="submit">Save</button></div><input id="reminderId" type="hidden"/>
<label class="field"><span>Title</span><input id="titleInput" type="text" maxlength="120" placeholder="What do you need to do?" required/></label>
<div class="two-col"><label class="field"><span>Category / project</span><input id="categoryInput" type="text" maxlength="40" list="categorySuggestions" placeholder="e.g. House"/></label><label class="field"><span>Due date</span><input id="dateInput" type="date"/></label></div><datalist id="categorySuggestions"><option value="House"></option><option value="Shopping"></option><option value="Family"></option><option value="Car"></option><option value="Work"></option><option value="Personal"></option></datalist>
<fieldset class="field priority-fieldset"><legend>Priority</legend><div class="priority-picker"><label><input type="radio" name="priority" value="high" checked/><span class="pill high">High</span></label><label><input type="radio" name="priority" value="medium"/><span class="pill medium">Medium</span></label><label><input type="radio" name="priority" value="low"/><span class="pill low">Low</span></label></div></fieldset>
<label class="field"><span>Notes / information</span><textarea id="notesInput" rows="4" maxlength="3000" placeholder="Add details, addresses, measurements, shopping notes, etc."></textarea></label>
<section class="checklist-editor"><div class="section-head"><div><strong>Checklist</strong><small>Break this reminder into smaller steps.</small></div></div><div class="checklist-add"><input id="checklistNewInput" type="text" maxlength="160" placeholder="Add a checklist item"/><button id="addChecklistBtn" type="button">Add</button></div><div id="checklistEditorList" class="checklist-editor-list"></div></section>
<div class="two-col"><label class="field"><span>Alert time</span><input id="timeInput" type="time"/></label><label class="toggle-row compact"><div><strong>Notification</strong><small>Alert at due date/time</small></div><input id="alertToggle" type="checkbox"/></label></div>
<section class="photo-section"><div class="field-label">Photos</div><div class="photo-actions"><label class="photo-btn">📷 Camera<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden/></label><label class="photo-btn">🖼️ Gallery<input id="galleryInput" type="file" accept="image/*" multiple hidden/></label></div><div id="photoPreview" class="photo-preview"></div></section><button id="deleteBtn" class="danger-btn hidden" type="button">Delete reminder</button></form></dialog>
<dialog id="photoDialog" class="photo-dialog"><button id="closePhotoBtn" class="photo-close" type="button" aria-label="Close photo">×</button><button id="prevPhotoBtn" class="photo-nav prev" type="button" aria-label="Previous photo">‹</button><img id="fullPhoto" alt="Reminder photo"/><button id="nextPhotoBtn" class="photo-nav next" type="button" aria-label="Next photo">›</button><div id="photoCounter" class="photo-counter"></div></dialog><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
